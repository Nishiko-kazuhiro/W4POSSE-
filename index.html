<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POSSE shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- ヘッダー -->
  <header class="bg-white border-b">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <a class="text-3xl font-bold">POSSE shop</a>
      <a class="bg-emerald-600 text-white text-sm px-4 py-2 rounded hover:bg-blue-700">
        カート (0)
      </a>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">商品一覧</h1>

    <!-- 商品グリッド（スマホ2列 / PC4列） -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">

      <div class="bg-white p-4 rounded-lg border shadow-sm hover:shadow-lg hover:bg-blue-50 text-center">
        <div class="text-5xl mb-3">🖋</div>
        <h2 class="font-bold">ペン</h2>
        <p class="text-emerald-700 font-bold mt-1">¥300</p>
      </div>

      <div class="bg-white p-4 rounded-lg border shadow-sm hover:shadow-lg hover:bg-blue-50 text-center">
        <div class="text-5xl mb-3">🪴</div>
        <h2 class="font-bold">植え木鉢</h2>
        <p class="text-emerald-700 font-bold mt-1">¥3,200</p>
      </div>

      <div class="bg-white p-4 rounded-lg border shadow-sm hover:shadow-lg hover:bg-blue-50 text-center">
        <div class="text-5xl mb-3">🕯️</div>
        <h2 class="font-bold">キャンドル</h2>
        <p class="text-emerald-700 font-bold mt-1">¥2,400</p>
      </div>

      <div class="bg-white p-4 rounded-lg border shadow-sm hover:shadow-lg hover:bg-blue-50 text-center">
        <div class="text-5xl mb-3">🫖</div>
        <h2 class="font-bold">ティーポット</h2>
        <p class="text-emerald-700 font-bold mt-1">¥3,900</p>
      </div>

      <div class="bg-white p-4 rounded-lg border shadow-sm hover:shadow-lg hover:bg-blue-50 text-center">
        <div class="text-5xl mb-3">🧣</div>
        <h2 class="font-bold">ストール</h2>
        <p class="text-emerald-700 font-bold mt-1">¥4,500</p>
      </div>

      <div class="bg-white p-4 rounded-lg border shadow-sm hover:shadow-lg hover:bg-blue-50 text-center">
        <div class="text-5xl mb-3">🍯</div>
        <h2 class="font-bold">国産はちみつ</h2>
        <p class="text-emerald-700 font-bold mt-1">¥1,980</p>
      </div>

      <div class="bg-white p-4 rounded-lg border shadow-sm hover:shadow-lg hover:bg-blue-50 text-center">
        <div class="text-5xl mb-3">📓</div>
        <h2 class="font-bold">ノート</h2>
        <p class="text-emerald-700 font-bold mt-1">¥1,650</p>
      </div>

      <div class="bg-white p-4 rounded-lg border shadow-sm hover:shadow-lg hover:bg-blue-50 text-center">
        <div class="text-5xl mb-3">🧺</div>
        <h2 class="font-bold">編み込みバスケット</h2>
        <p class="text-emerald-700 font-bold mt-1">¥4,200</p>
      </div>

    </div>
  </main>

  <!-- フッター -->
  <footer class="text-center text-sm text-gray-500 py-6 border-t mt-10">
  </footer>

</body>
</html>
